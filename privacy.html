      <a href="index.html" class="navbar__logo"><img src="assets/logo.png" alt="Лого" /><div class="navbar__logo-text">Кафе Бар Че<span>Скопје</span></div></a>
      <nav class="navbar__nav">
        <a href="index.html" class="navbar__link" data-i18n="nav.home">Дома</a>

        <a href="events.html" class="navbar__link" data-i18n="nav.events">Настани</a>
        <a href="team.html" class="navbar__link" data-i18n="nav.team">Тим</a>
        <a href="contact.html" class="navbar__link" data-i18n="nav.contact">Контакт</a>
      </nav>
      <div class="navbar__actions">
        <div class="lang-toggle" role="group"><button class="lang-btn active" data-lang="mk">MK</button><button class="lang-btn" data-lang="en">EN</button></div>

        <h1 data-i18n="privacy.title">Приватност и колачиња</h1>

    <section class="section">

        <article class="legal reveal">

          <p data-i18n="privacy.contact_text"></p>
          <p class="mt-24">
            <button type="button" class="btn btn-outline" data-cookie-settings>
